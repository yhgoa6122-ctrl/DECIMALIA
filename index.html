/* LÓGICA MATEMÁTICA Y ESTADÍSTICAS */
function parseCents(raw){
  const s=String(raw??"").trim().replace(",",".");
  if(!/^(?:\d{1,4}(?:\.\d{1,2})?|\.\d{1,2})$/.test(s)){
    return null;
  }
  const [whole="",fraction=""]=s.split(".");
  return Number(whole||0)*100+Number(fraction.padEnd(2,"0"));
}

function dec(n){
  return Math.floor(n/100)+"."+String(n%100).padStart(2,"0");
}

function decode(q,raw){
  if(q.kind==="equal"||q.kind==="money")return parseCents(raw);
  if(q.kind==="compare")return ["<","=",">"].includes(raw)?raw:null;
  return Number.isInteger(raw)&&raw>=0&&
    raw<=(q.kind==="ten"?10:100)?raw:null;
}

function submitAnswer(profile,q,raw){
  const value=decode(q,raw);
  if(value===null)return {invalid:true};

  const correct=value===q.answer;
  const r=profile.results[q.id]||(profile.results[q.id]={
    attempts:0,hints:0,solved:false,first:false,last:null
  });

  if(r.solved)return {correct,practice:true,counted:false};

  const signature=String(value);
  if(r.last===signature){
    return {correct,duplicate:true,counted:false};
  }

  r.last=signature;
  r.attempts++;

  if(r.attempts===1)r.first=correct;
  r.solved=correct;

  return {correct,counted:true};
}

function useHint(profile,q){
  const r=profile.results[q.id]||(profile.results[q.id]={
    attempts:0,hints:0,solved:false,first:false,last:null
  });
  if(!r.solved)r.hints++;
}

function summary(profile,questions){
  const records=questions.map(q=>profile.results[q.id]).filter(Boolean);
  const attempted=records.filter(r=>r.attempts>0).length;
  const solved=records.filter(r=>r.solved).length;
  const first=records.filter(r=>r.first).length;

  return {
    attempted,
    solved,
    first,
    accuracy:attempted?Math.round(100*first/attempted):null,
    hints:records.reduce((n,r)=>n+r.hints,0)
  };
}

function esc(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

/* ESTADO DE LA APLICACIÓN */

/* GUARDADO LOCAL POR NOMBRE */
function loadData(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");

    if(!raw||raw.version!==1||!Array.isArray(raw.players)){
      return {version:1,players:[]};
    }

    const players=raw.players
      .filter(p=>
        p&&typeof p.name==="string"&&p.name.trim()&&
        p.results&&typeof p.results==="object"
      )
      .map(p=>{
        const results={};

        for(const q of ALL){
          const r=p.results[q.id];

          if(r&&Number.isInteger(r.attempts)&&
             r.attempts>=0&&r.attempts<=10000){
            results[q.id]={
              attempts:r.attempts,
              hints:Number.isInteger(r.hints)
                ?Math.max(0,Math.min(10000,r.hints)):0,
              solved:r.solved===true&&r.attempts>0,
              first:r.first===true&&r.attempts>0,
              last:typeof r.last==="string"?r.last:null
            };
          }
        }

        return {
          name:p.name.trim().slice(0,24),
          mascot:Number.isInteger(p.mascot)&&
            p.mascot>=0&&p.mascot<3?p.mascot:0,
          results
        };
      });

    return {version:1,players};
  }catch(e){
    note="No pudimos leer un guardado anterior. Puedes empezar a jugar.";
    return {version:1,players:[]};
  }
}

function startPlayer(){
  const name=$("player-name").value.trim().replace(/\s+/g," ").slice(0,24);

  if(!name||!/\p{L}/u.test(name)){
    $("name-error").textContent="Escribe un nombre con letras para empezar.";
    $("player-name").focus();
    return;
  }

  const key=name.normalize("NFKC").toLocaleLowerCase("es-MX");

  player=db.players.find(p=>
    p.name.normalize("NFKC").toLocaleLowerCase("es-MX")===key
  );

    db.players.push(player);
  }else{
    player.mascot=chosen;
  }

  save();
  renderHome();
}

/* INICIO DE UNA MISIÓN */
function openLesson(id){
  if(!player)return;

  const lesson=LESSONS.find(l=>l.id===id);
  if(!lesson)return;

  const first=lesson.questions.findIndex(q=>!player.results[q.id]?.solved);

  session={
    lesson,
    index:first<0?0:first,
    replay:first<0
  };

  resetQuestion();
  renderGame();
}

function resetQuestion(){
  Object.assign(session,{
    amount:0,
    tiles:Array(10).fill(false),
    choice:null,
    status:"idle",
    hint:false
  });
}

function currentQ(){
  return session.lesson.questions[session.index];
}

function prompt(q){
  if(q.kind==="ten"){
    return "Pinta "+dec(q.answer*10).replace(/0$/,"")+" de la barra.";
  }
  if(q.kind==="hundred"){
    return "Construye "+dec(q.answer)+" con los cuadritos.";
  }
  if(q.kind==="equal"){
    return "¿Qué número vale lo mismo que "+q.shown+"?";
  }
  if(q.kind==="compare"){
    return "Elige el signo que completa la comparación.";
  }
  return q.mode==="sum"
    ?"¿Cuánto cuestan los dos objetos juntos?"
    :"¿Cuánto cambio te deben dar?";
}

      session.tiles.map((on,i)=>

        '" data-tile="'+i+
        '" aria-label="Parte '+(i+1)+' de 10" aria-pressed="'+on+'">'+
        "<span>"+(i+1)+"</span></button>"
      ).join("")+
      '</div><p class="visual-caption">La barra completa vale 1 unidad.</p>';
  }else if(q.kind==="hundred"){
    out=
      '<div class="hundred-grid" role="img" aria-label="'+value+
      ' de 100 cuadritos pintados">'+
      Array.from({length:100},(_,i)=>

      ).join("")+
      "</div>"+
      '<p class="visual-caption">La cuadrícula completa vale 1 unidad.</p>';

/* AYUDA Y EXPLICACIONES */
function hintText(q){
  if(q.kind==="ten"){
    return "Cada parte vale un décimo (0.1). Fíjate en cuántos "+
      "décimos pide el número y pinta esa cantidad de partes.";
  }
  if(q.kind==="hundred"){
    return "Cada fila tiene 10 cuadritos y vale 0.10. Puedes añadir "+
      "filas de diez y después cuadritos de uno en uno.";
  }
  if(q.kind==="equal"){
    return "Agregar o quitar un cero al final de la parte decimal "+
      "conserva el valor. Por ejemplo: 0.4 = 0.40.";
  }
  if(q.kind==="compare"){
    return "Escribe ambos con centésimos: "+dec(q.a)+" y "+dec(q.b)+
      ". Compara "+q.a+" centésimos con "+q.b+
      " centésimos. La abertura del signo mira al número mayor.";
  }
  return q.mode==="sum"
    ?"Para saber el total, suma los dos precios. Escribe unidades "+
      "bajo unidades y centésimos bajo centésimos."
    :"Para saber el cambio, resta el precio del dinero con el que pagas.";
}

function showHint(){
  if(!session||session.hint||session.status==="success")return;

  session.hint=true;
  useHint(player,currentQ());
  save();

  $("hint-box").hidden=false;
  $("hint-box").textContent=
    mascots[player.mascot]+": "+hintText(currentQ());

  $("hint-button").disabled=true;
  $("hint-button").textContent="Pista abierta";
}

function explanation(q){
  if(q.kind==="ten"){
    return q.answer+" décimos son "+dec(q.answer*10)+
      ". Diez décimos forman una unidad.";
  }
  if(q.kind==="hundred"){
    return q.answer+" centésimos se escriben "+dec(q.answer)+
      ". Cien centésimos forman una unidad.";
  }
  if(q.kind==="equal"){
    return q.shown+" y "+dec(q.answer)+" representan la misma cantidad.";
  }
  if(q.kind==="compare"){
    return dec(q.a)+" "+q.answer+" "+dec(q.b)+
      ". Estamos comparando "+q.a+" y "+q.b+" centésimos.";
  }
  return "$"+dec(q.a)+(q.mode==="sum"?" + $":" − $")+
    dec(q.b)+" = $"+dec(q.answer)+".";
}

/* COMPROBACIÓN Y AVANCE */
function checkAnswer(){
  if(!session||session.status==="success")return;

  const q=currentQ();
  const raw=q.kind==="ten"||q.kind==="hundred"
    ?session.amount
    :q.kind==="money"
      ?$("money-answer").value
      :session.choice;

  const outcome=submitAnswer(player,q,raw);
  const feedback=$("feedback");
  feedback.className="feedback";

  if(outcome.invalid){
    feedback.textContent=q.kind==="money"
      ?"Escribe una cantidad como 3.50."
      :"Elige una respuesta para comprobarla.";
    return;
  }

  if(outcome.duplicate){
    feedback.textContent="Cambia tu respuesta antes de intentarlo otra vez.";
    return;
  }

  save();

  if(outcome.correct){
    session.status="success";

    feedback.classList.add("correct");
    feedback.textContent="¡Lo lograste! "+explanation(q);

    $("check-button").hidden=true;
    $("next-button").hidden=false;
    $("hint-button").disabled=true;

    $("challenge-form")
      .querySelectorAll(
        "input, button[data-choice], button[data-tile], button[data-delta]"
      )
      .forEach(el=>el.disabled=true);

    $("next-button").focus();
  }else{
    session.status="retry";
    feedback.classList.add("retry");
    feedback.textContent=
      "Todavía no. Puedes cambiar tu respuesta o pedir una pista.";
  }
}

function advance(){
  if(!session||session.status!=="success")return;

  session.index++;

  if(session.index>=session.lesson.questions.length){
    return renderComplete();
  }

  resetQuestion();
  renderGame();
}

/* CONTROLES */
document.addEventListener("submit",ev=>{
  if(ev.target.id==="entry-form"){
    ev.preventDefault();
    startPlayer();
  }
  if(ev.target.id==="challenge-form"){
    ev.preventDefault();
    checkAnswer();
  }
});

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");
  if(!b||b.disabled)return;

  if(b.dataset.mascot!==undefined){
    chosen=Number(b.dataset.mascot);

    document.querySelectorAll("[data-mascot]").forEach(el=>{
      el.setAttribute(
        "aria-pressed",
        String(Number(el.dataset.mascot)===chosen)
      );
    });
    return;
  }

  if(b.dataset.lesson){
    openLesson(b.dataset.lesson);
    return;
  }

  if(b.dataset.action){
    ({
      home:renderHome,
      stats:renderStats,
      logout:renderEntry,
      hint:showHint,
      next:advance,
      print:()=>window.print()
    })[b.dataset.action]?.();
    return;
  }

  if(!session||session.status==="success")return;

  if(b.dataset.tile!==undefined){
    const i=Number(b.dataset.tile);
    session.tiles[i]=!session.tiles[i];
    session.amount=session.tiles.filter(Boolean).length;

    paintVisual();

    document.querySelector('[data-tile="'+i+'"]')
      ?.focus({preventScroll:true});
  }

  if(b.dataset.delta!==undefined){
    session.amount=Math.max(
      0,
      Math.min(100,session.amount+Number(b.dataset.delta))
    );
    paintVisual();
  }

  if(b.dataset.choice!==undefined){
    session.choice=b.dataset.choice;

    document.querySelectorAll("[data-choice]").forEach(el=>{
      el.setAttribute(
        "aria-pressed",
        String(el.dataset.choice===session.choice)
      );
    });

    if($("chosen-sign")){
      $("chosen-sign").textContent=session.choice;
    }
  }
});

renderEntry();
</script>
</body>
</html>
